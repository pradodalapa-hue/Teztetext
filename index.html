<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111827">
    <title>Jalhica // Girabase Engine JDP</title>
    <style>
        :root {
            --bg-deep: #111827;
            --panel-bg: #1f2937;
            --border-color: #374151;
            --cyan-glow: #06b6d4;
            --yellow-gold: #fde047;
            --alert-red: #ef4444;
            --terminal-green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        html, body { width: 100%; height: 100%; background-color: var(--bg-deep); color: #fff; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; position: relative; }

        /* GATILHO DA SALA DE MÁQUINAS (CANTO SUPERIOR ESQUERDO) */
        #secret-trigger { position: absolute; top: 0; left: 0; width: 60px; height: 60px; opacity: 0; z-index: 9999; cursor: pointer; }

        /* CARRINHO (CANTO SUPERIOR DIREITO) */
        #cart-widget { position: fixed; top: 15px; right: 15px; z-index: 1000; background: var(--panel-bg); border: 2px solid var(--yellow-gold); border-radius: 50px; padding: 6px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        #cart-count { background: var(--alert-red); color: #fff; font-weight: bold; font-size: 11px; padding: 2px 6px; border-radius: 10px; }

        header { text-align: center; padding-bottom: 10px; border-bottom: 2px solid #2563eb; flex-shrink: 0; }
        header h1 { color: var(--yellow-gold); font-size: 1.3rem; }

        main { flex-grow: 1; max-width: 800px; width: 100%; margin: 10px auto; display: flex; flex-direction: column; overflow: hidden; position: relative; }

        .interface-jalhica { background: var(--panel-bg); padding: 15px; border-radius: 8px; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--border-color); }
        #chat-form { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border-color); margin-top: auto; }
        #user-input { flex-grow: 1; padding: 10px; border: none; border-radius: 6px; background: #374151; color: white; outline: none; }
        #send-button { padding: 10px 14px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .message { padding: 10px; border-radius: 10px; max-width: 85%; font-size: 13px; line-height: 1.4; }
        .user-message { align-self: flex-end; background: #2563eb; }
        .jalhica-message { align-self: flex-start; background: #4b5563; }

        .rendered-img { max-width: 100%; height: auto; border-radius: 6px; margin-top: 6px; border: 1px solid var(--cyan-glow); }
        .btn-add-cart { background: var(--yellow-gold); color: #000; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 4px; width: 100%; }

        /* TELA DE MÁQUINAS E CARRINHO */
        #engineering-deck, #cart-modal { display: none; flex-direction: column; gap: 1rem; width: 100%; background: var(--bg-deep); padding: 1rem; border-radius: 8px; border: 1px solid var(--yellow-gold); height: 100%; position: absolute; top: 0; left: 0; z-index: 500; overflow-y: auto; }
        .btn-close { background: transparent; border: none; color: #ef4444; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <button id="secret-trigger" onclick="toggleDeck()"></button>

    <div id="cart-widget" onclick="toggleCarrinho()">
        <span>🛒</span>
        <span id="cart-count">0</span>
    </div>

    <header>
        <h1>🤖 Jalhica Engine</h1>
        <p><small>Arquiteto: José Divino Prado da Lapa // PRINCESA DIAMANTE</small></p>
    </header>

    <main>
        <section id="chat-window" class="interface-jalhica">
            <div class="message jalhica-message">
                Olá, Engenheiro! O Trabalhador (app.js) está ativo na memória e rodando em realtime.
            </div>
            
            <form id="chat-form" onsubmit="enviarMensagem(event)">
                <input type="text" id="user-input" placeholder="Cole uma URL de imagem ou digite uma mensagem..." autocomplete="off">
                <button type="submit" id="send-button">Enviar</button>
            </form>
        </section>

        <!-- TELA DO CARRINHO (FRONT-END) -->
        <div id="cart-modal">
            <div style="display:flex; justify-between; align-items:center;">
                <span style="color:var(--yellow-gold); font-weight:bold;">🛒 CARRINHO EM MEMÓRIA</span>
                <button onclick="toggleCarrinho()" class="btn-close">✕ FECHAR</button>
            </div>
            <div id="cart-list" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap:10px; margin-top:10px;"></div>
        </div>

        <!-- SALA DE MÁQUINAS (BACK-END) -->
        <div id="engineering-deck">
            <div style="display:flex; justify-between; align-items:center;">
                <span style="color:var(--yellow-gold); font-weight:bold;">// SALA DE MÁQUINAS (RETAGUARDA)</span>
                <button onclick="toggleDeck()" class="btn-close">✕ FECHAR</button>
            </div>
            <div style="margin-top:10px; display:flex; flex-direction:column; gap:10px;">
                <button onclick="JALHICA_ENGINE.exportarDados('dados.json')" style="padding:10px; background:#0284c7; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">📥 Baixar dados.json Compilado</button>
                <span id="val-sinapses" style="font-size:11px; color:var(--cyan-glow);">Sinapses Ativas: 0</span>
            </div>
        </div>
    </main>

    <!-- INJEÇÃO DO TRABALHADOR -->
    <script src="app.js"></script>

    <script>
        function toggleDeck() {
            const d = document.getElementById('engineering-deck');
            d.style.display = d.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleCarrinho() {
            const c = document.getElementById('cart-modal');
            c.style.display = c.style.display === 'flex' ? 'none' : 'flex';
            if (c.style.display === 'flex') renderCarrinho();
        }

        function renderCarrinho() {
            const container = document.getElementById('cart-list');
            const vendas = JALHICA_ENGINE.vendasBrutas;
            if (vendas.length === 0) {
                container.innerHTML = '<p style="font-size:11px; color:#9ca3af;">Carrinho vazio.</p>';
                return;
            }
            container.innerHTML = vendas.map(v => `
                <div style="background:#1f2937; padding:4px; border-radius:4px; text-align:center;">
                    <img src="${v.url_foto}" style="width:100%; height:70px; object-fit:cover; border-radius:4px;">
                </div>
            `).join('');
        }

        function enviarMensagem(e) {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const txt = input.value.trim();
            if (!txt) return;

            const chat = document.getElementById('chat-window');
            const form = document.getElementById('chat-form');

            // Exibe mensagem do usuário
            const msgUser = document.createElement('div');
            msgUser.className = 'message user-message';
            msgUser.innerText = txt;
            chat.insertBefore(msgUser, form);

            // Se for URL de foto
            if (/(https?:\/\/[^\s<]+?\.(?:png|jpg|jpeg|gif|webp))/i.test(txt)) {
                const msgBot = document.createElement('div');
                msgBot.className = 'message jalhica-message';
                msgBot.innerHTML = `
                    Foto identificada!
                    <img src="${txt}" class="rendered-img">
                    <button class="btn-add-cart" onclick="adicionarFoto('${txt}')">🛒 Adicionar ao Carrinho</button>
                `;
                chat.insertBefore(msgBot, form);
            }

            input.value = '';
            chat.scrollTop = chat.scrollHeight;
        }

        function adicionarFoto(url) {
            // Chama a autoridade do Trabalhador
            JALHICA_ENGINE.registrarVenda(url, 'Foto Carrinho', 0);
            alert('Foto registrada pelo Trabalhador!');
        }
    </script>
</body>
</html>
